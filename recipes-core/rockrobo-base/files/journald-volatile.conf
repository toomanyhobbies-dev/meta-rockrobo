# journald in RAM only (/run/log/journal): no eMMC write wear on the robot's single 4 GB flash. For debugging, flip
# to persistent on the DATA partition (not the system slot) with a capped size -- never persist to the rootfs slot.
[Journal]
Storage=volatile
RuntimeMaxUse=16M
RateLimitIntervalSec=10s
RateLimitBurst=2000
