# Pet the SoC watchdog so a healthy distro isn't reset. U-Boot arms the sunxi watchdog and the kernel only feeds an
# unopened /dev/watchdog for WATCHDOG_OPEN_TIMEOUT (60 s) -- after that a running-but-unopened system resets (~76 s)
# and the bootloader falls back to the other slot. systemd opens and pings /dev/watchdog here, so a healthy system
# stays up while a wedged systemd still resets (and falls back to the other slot). The sunxi watchdog maxes at 16 s, so 15 s.
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min
