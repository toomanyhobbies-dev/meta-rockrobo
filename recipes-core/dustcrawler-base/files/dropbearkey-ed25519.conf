# Generate an ed25519 host key instead of RSA. The key lives on tmpfs (/run/dropbear) and is regenerated each boot
# (the stock unit's ConditionPathExists checks only /etc and /var/lib), so a fast keygen matters: ed25519 is
# near-instant where RSA is slow. DROPBEAR_RSAKEY_DIR + EnvironmentFile come from the base unit.
[Service]
ExecStart=
ExecStart=/usr/bin/mkdir -p ${DROPBEAR_RSAKEY_DIR}
ExecStart=/usr/sbin/dropbearkey -t ed25519 -f ${DROPBEAR_RSAKEY_DIR}/dropbear_ed25519_host_key
