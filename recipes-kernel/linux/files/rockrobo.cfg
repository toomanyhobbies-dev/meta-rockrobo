# Roborock R16 robots, booted by the stock 2011.09 U-Boot (ext4load /boot/zImage; bootz, no FDT argument).

# the device tree is appended to the zImage; the command line (root=/dev/mmcblk0p8|9 ...) comes from the ATAGs
CONFIG_ARM_APPENDED_DTB=y
CONFIG_ARM_ATAG_DTB_COMPAT=y
CONFIG_ARM_ATAG_DTB_COMPAT_CMDLINE_FROM_BOOTLOADER=y

# The stock bootloader arms the SoC watchdog (16 s) before starting Linux. The kernel feeds it until userspace opens
# /dev/watchdog, but at most OPEN_TIMEOUT seconds; if nothing opens it the watchdog resets the board and the bootloader
# falls back to the other slot. systemd opens and pets it in the running system (see 10-watchdog.conf); the 60 s window
# is a hands-off backstop for a boot that never reaches userspace.
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_SUNXI_WATCHDOG=y
CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y
CONFIG_WATCHDOG_OPEN_TIMEOUT=60

# CPU frequency scaling over the device tree's OPPs (S5: with DCDC3 as cpu-supply)
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
CONFIG_CPUFREQ_DT=y

# AXP223 PMIC on RSB + its regulators. Only the S5's device tree has a PMIC node (its Wi-Fi needs DLDO2), and it
# constrains just the two Wi-Fi rails; on the Gen 1 nothing binds. Battery/charger/ADC drivers stay off.
CONFIG_MFD_AXP20X_RSB=y
CONFIG_REGULATOR_AXP20X=y

# A33 thermal sensor (GPADC), for the SoC's cpu-thermal zone and hwmon
CONFIG_IIO=y
CONFIG_SUN4I_GPADC=y
CONFIG_SENSORS_IIO_HWMON=y

# A33 audio codec, its I2S interface and the speaker amplifier
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_SOC=y
CONFIG_SND_SUN4I_I2S=y
CONFIG_SND_SUN8I_CODEC=y
CONFIG_SND_SUN8I_CODEC_ANALOG=y
CONFIG_SND_SIMPLE_CARD=y
CONFIG_SND_SOC_SIMPLE_AMPLIFIER=y

# SID efuses (chip id)
CONFIG_NVMEM=y
CONFIG_NVMEM_SUNXI_SID=y

# root filesystem on the eMMC without an initramfs
CONFIG_MMC=y
CONFIG_MMC_SUNXI=y
CONFIG_EXT4_FS=y

# The eMMC has the stock A/B layout with partitions numbered up to mmcblk0p11 (p8=system_a, p9=system_b, p10=Download,
# p11=reserve); root is p9. The default CONFIG_MMC_BLOCK_MINORS=8 caps each card at 8 minors = whole disk + only 7
# partitions, so p8..p11 are never created and root=/dev/mmcblk0p9 can't be found ("Can't lookup blockdev"), even
# though the DOS MBR parses fine. 32 covers the 11 partitions (plus headroom) with one minor each.
CONFIG_MMC_BLOCK_MINORS=32

# The stock bootloader cmdline has no "rw" (it mounts the slot read-only). CMDLINE_EXTEND appends CONFIG_CMDLINE (set
# from the bitbake CMDLINE var in the bbappend -- kernel.bbclass rewrites CONFIG_CMDLINE from ${CMDLINE}, so it must be
# set there, not in this fragment) to the bootloader cmdline; the appended args add rw.
CONFIG_CMDLINE_EXTEND=y

# TODO: re-enable STRICT_*_RWX (the mainline default). Turned off during early bring-up and not yet re-tested.
# CONFIG_STRICT_KERNEL_RWX is not set
# CONFIG_STRICT_MODULE_RWX is not set

# debugfs for runtime diagnostics (e.g. /sys/kernel/debug/mmcN/ios).
CONFIG_DEBUG_FS=y

# overlayfs for the /opt app overlay. Built-in (not =m) to avoid a module-load race with the early opt.mount.
CONFIG_OVERLAY_FS=y
