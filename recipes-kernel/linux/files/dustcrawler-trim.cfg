# Roborock R16 robots: drop the subsystems meta-sunxi's generic ARM defconfig builds that these boards don't have or
# use. Of its ~617 modules the images install two (cfg80211 and the out-of-tree 8189es); every other one is built,
# packaged, QA-checked and SPDX-documented on each kernel build. Re-enable a menu here when a robot needs it.
#
# Kept on purpose: CONFIG_MODULES (8189es is out of tree), CONFIG_CFG80211 (8189es is a fullmac cfg80211 driver),
# AF_UNIX/AF_PACKET/IPv4/IPv6, and the built-in drivers (storage, USB, framebuffer, input), which this does not touch.

# cameras, TV/DVB tuners, radio
# CONFIG_MEDIA_SUPPORT is not set
# Bluetooth, IEEE 802.15.4 / 6LoWPAN
# CONFIG_BT is not set
# CONFIG_IEEE802154 is not set
# CONFIG_6LOWPAN is not set
# packet filtering/NAT and traffic shaping: no firewall, router or shaper on the robots
# CONFIG_NETFILTER is not set
# CONFIG_NET_SCHED is not set
# softmac Wi-Fi stack and every in-tree Wi-Fi chip driver (the robots' RTL8189ES uses the out-of-tree 8189es)
# CONFIG_MAC80211 is not set
# CONFIG_WLAN_VENDOR_ADMTEK is not set
# CONFIG_WLAN_VENDOR_ATH is not set
# CONFIG_WLAN_VENDOR_ATMEL is not set
# CONFIG_WLAN_VENDOR_BROADCOM is not set
# CONFIG_WLAN_VENDOR_CISCO is not set
# CONFIG_WLAN_VENDOR_INTEL is not set
# CONFIG_WLAN_VENDOR_INTERSIL is not set
# CONFIG_WLAN_VENDOR_MARVELL is not set
# CONFIG_WLAN_VENDOR_MEDIATEK is not set
# CONFIG_WLAN_VENDOR_MICROCHIP is not set
# CONFIG_WLAN_VENDOR_PURELIFI is not set
# CONFIG_WLAN_VENDOR_RALINK is not set
# CONFIG_WLAN_VENDOR_REALTEK is not set
# CONFIG_WLAN_VENDOR_RSI is not set
# CONFIG_WLAN_VENDOR_SILABS is not set
# CONFIG_WLAN_VENDOR_ST is not set
# CONFIG_WLAN_VENDOR_TI is not set
# CONFIG_WLAN_VENDOR_ZYDAS is not set
# CONFIG_WLAN_VENDOR_QUANTENNA is not set
# no Ethernet on the boards; no USB network adapters, USB serial adapters or virtual/aggregated links in use
# CONFIG_ETHERNET is not set
# CONFIG_USB_NET_DRIVERS is not set
# CONFIG_USB_SERIAL is not set
# CONFIG_PPP is not set
# CONFIG_L2TP is not set
# CONFIG_BONDING is not set
# CONFIG_NET_TEAM is not set
# CONFIG_VXLAN is not set
# CONFIG_MACVLAN is not set
# CONFIG_BRIDGE is not set
# CONFIG_VLAN_8021Q is not set
# CONFIG_VSOCKETS is not set
# filesystems the eMMC never carries (rootfs and /mnt/data are ext4)
# CONFIG_BTRFS_FS is not set
# CONFIG_XFS_FS is not set
