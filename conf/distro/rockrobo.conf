# Minimal systemd distro for the Roborock R16 on-robot system, derived from poky.
require conf/distro/poky.conf

DISTRO = "rockrobo"
DISTRO_NAME = "rockrobo"
DISTRO_VERSION = "0.1"
MAINTAINER = "Tam Do <tam.do@manyhobbies.com>"
SDK_VENDOR = "-rockrobosdk"

INIT_MANAGER = "systemd"

# R16 vacuum: no display, bluetooth, cellular, nfc or audio server.
DISTRO_FEATURES:remove = "x11 wayland vulkan opengl bluetooth 3g nfc pulseaudio pcmcia irda"

# Read-only rootfs with whole-slot (A/B) updates; no on-device package manager.
IMAGE_FEATURES:remove = "package-management"

INHERIT += "rm_work"
