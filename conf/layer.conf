# Roborock R16 robots (S5, Gen 1): machines, device trees, kernel config, test images.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "rockrobo"
BBFILE_PATTERN_rockrobo = "^${LAYERDIR}/"
BBFILE_PRIORITY_rockrobo = "10"
LAYERDEPENDS_rockrobo = "core sunxi"
LAYERSERIES_COMPAT_rockrobo = "scarthgap"
