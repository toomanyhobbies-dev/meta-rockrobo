# Roborock R16 robots (S5, Gen 1): machines, device trees, kernel config, test images.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "dustcrawler"
BBFILE_PATTERN_dustcrawler = "^${LAYERDIR}/"
BBFILE_PRIORITY_dustcrawler = "10"
LAYERDEPENDS_dustcrawler = "core sunxi"
LAYERSERIES_COMPAT_dustcrawler = "wrynose"
